<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ShadowARSA portfolio landing page" />
    <title>ShadowARSA</title>
    <link rel="icon" type="image/x-icon" href="../images/130658764" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="contact.css" />

  <body>
    <header class="navbar">
      <a href="#" class="logo">
        <span>Shadow<span class="red">ARSA</span></span>
      </a>

      <nav class="nav-links" aria-label="Main navigation">
        <a href="../index.html" class="nav-link">
          <span>Home</span>
        </a>

        <a href="./projects.html" class="nav-link">
          <span>Projects</span>
        </a>

        <a href="./contact.html" class="nav-link active">
          <span>Contact</span>
        </a>
      </nav>
    </header>
    <main>
      <section class="contact">
        <h2 class="contactHead">This is a <span>Contact</span> page </h2>
        <form action="#">
          <label for="text">Username</label><br>
          <input type="text" name="text" id="textInput" placeholder="Username">
          <br>
          <label for="email">Email</label><br>
          <input type="email" name="email" id="emailInput" placeholder="Email">
          <br>
          <label for="text">Message (Max 100 characters)</label><br>
          <textarea name="text" id="textBox" maxlength="100" placeholder="Type your message for me!!"></textarea><br><br>
          <a href="./thankyou.html" class="subBtn"
              >Get it!</a
            >
        </form>
      </section>
    </main>
  </body>
